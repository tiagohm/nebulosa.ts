name: CI

on:
    push:
        branches: [main]
        paths:
            - 'src/**.ts'
            - 'tests/**.ts'
            - 'native/**.zip'
            - 'main.ts'
            - 'types.d.ts'
            - 'postinstall.ts'
            - 'data/.version'
            - 'package.json'
            - 'bun.lock'
            - 'tsconfig.json'
            - 'bunfig.toml'
            - '.oxlintrc.json'
            - '.oxfmtrc.json'
            - '.github/workflows/**'
    pull_request:
        paths:
            - 'src/**.ts'
            - 'tests/**.ts'
            - 'native/**.zip'
            - 'main.ts'
            - 'types.d.ts'
            - 'postinstall.ts'
            - 'data/.version'
            - 'package.json'
            - 'bun.lock'
            - 'tsconfig.json'
            - 'bunfig.toml'
            - '.oxlintrc.json'
            - '.oxfmtrc.json'
            - '.github/workflows/**'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test
        if: github.event.pull_request.merged == false
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false
                  fetch-depth: ${{ matrix.os == 'ubuntu-24.04' && '50' || '1' }}

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: canary

            - name: Install Dependencies
              if: ${{ matrix.os == 'ubuntu-24.04' }}
              run: bun install --frozen-lockfile

            - name: Install Dependencies
              if: ${{ matrix.os != 'ubuntu-24.04' }}
              run: bun install --frozen-lockfile --omit=dev

            - name: Cache Data Files
              if: ${{ matrix.os == 'ubuntu-24.04' }}
              uses: actions/cache@v6
              with:
                  path: data/
                  key: data

            - name: Lint
              if: ${{ matrix.os == 'ubuntu-24.04' }}
              run: bun lint

            - name: Run Tests
              if: ${{ matrix.os == 'ubuntu-24.04' }}
              shell: bash
              env:
                  TEST_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
              run: |
                  args=()
                  if [[ -n "$TEST_BASE_REF" ]] && git cat-file -e "${TEST_BASE_REF}^{commit}" 2>/dev/null; then
                      args+=("--changed=$TEST_BASE_REF")
                  fi
                  bun test --bail --timeout 30000 --parallel --pass-with-no-tests "${args[@]}" --timings=timings.json

            - name: Run Native Tests
              run: bun test --bail --timeout 30000 libwcs.test.ts jpeg.test.ts libastrometry.test.ts
