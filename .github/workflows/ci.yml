name: CI

on:
    push:
        branches: [main]
        paths:
            - 'src/**.ts'
            - 'tests/**.ts'
            - 'main.ts'
            - 'types.d.ts'
            - 'postinstall.ts'
            - 'data/.version'
            - 'package.json'
            - 'bun.lock'
            - 'tsconfig.json'
            - 'bunfig.toml'
            - '.oxlintrc.json'
            - '.oxfmtrc.json'
            - '.github/workflows/**'
    pull_request:
        paths:
            - 'src/**.ts'
            - 'tests/**.ts'
            - 'main.ts'
            - 'types.d.ts'
            - 'postinstall.ts'
            - 'data/.version'
            - 'package.json'
            - 'bun.lock'
            - 'tsconfig.json'
            - 'bunfig.toml'
            - '.oxlintrc.json'
            - '.oxfmtrc.json'
            - '.github/workflows/**'
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    test:
        name: Test
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
        runs-on: ${{ matrix.os }}
        steps:
            - name: Checkout
              uses: actions/checkout@v7
              with:
                  persist-credentials: false

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: canary

            - name: Install Dependencies
              if: ${{ matrix.os == 'ubuntu-24.04' }}
              run: bun install --frozen-lockfile

            - name: Install Dependencies
              if: ${{ matrix.os != 'ubuntu-24.04' }}
              run: bun install --frozen-lockfile --omit=dev

            - name: Cache Data Files
              if: ${{ matrix.os == 'ubuntu-24.04' }}
              uses: actions/cache@v6
              with:
                  path: data/
                  key: data-cache-${{ hashFiles('data/.version') }}

            - name: Check Formatting
              if: ${{ matrix.os == 'ubuntu-24.04' }}
              run: bun run fmt:check

            - name: Lint
              if: ${{ matrix.os == 'ubuntu-24.04' }}
              run: bun run lint

            - name: Run Tests
              if: ${{ matrix.os == 'ubuntu-24.04' }}
              run: bun test --timeout 1000 --parallel --timings=timings.json

            - name: Run Tests
              if: ${{ matrix.os != 'ubuntu-24.04' }}
              run: bun test --timeout 1000 libwcs.test.ts jpeg.test.ts libastrometry.test.ts
