<script>
	(() => {
		try {
			const theme = localStorage.getItem('theme');

			if (theme === 'nebulosa-dark' || theme === 'nebulosa-light') {
				if (jtd.getTheme() !== theme) {
					jtd.setTheme(theme);
				}
			}
		} catch {
			/* Keep the configured dark default when storage is unavailable. */
		}
	})();
</script>
