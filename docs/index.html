<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Nebulosa</title>
		<meta name="description" content="Elegant astronomy for TypeScript. Supercharged by Bun." />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css" />
		<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css" />
		<link rel="icon" href="nebulosa.ico" type="image/x-icon" />
		<style>
			:root {
				--theme-color: #2196f3;
				--cover-color: #212121;
				--cover-title-color: var(--theme-color);
				--cover-title-font: 600 var(--font-size-xxxl) var(--font-family);
				--color-text: #bdbdbd;
				--heading-color: #fafafa;
				--code-color: #ff7043;
				--content-max-width: 120ch;
			}

			html,
			body,
			.sidebar-nav {
				font-size: 14px;
			}

			.github-corner {
				position: fixed;
			}

			.octo-body,
			.octo-arm {
				color: #fff;
			}

			.sidebar {
				position: sticky;
			}

			.app-name img {
				max-width: 92px !important;
				margin-left: auto;
				margin-right: auto;
			}

			.anchor:is(.markdown-section a):hover {
				text-decoration-color: transparent !important;
				color: #fff;
			}

			.markdown-section p {
				text-align: justify;
			}

			.markdown-section p code,
			.markdown-section p a {
				white-space: nowrap;
				text-justify: none;
			}

			section.content {
				font-family: monospace;
			}

			section.search {
				position: sticky;
				left: var(--plugin-search-margin);
				top: var(--plugin-search-margin);
				z-index: 1;
			}

			a:not(.button) {
				color: var(--link-underline-color);
				text-decoration-line: none;
			}

			a:not(.button):hover {
				text-decoration-line: underline;
			}

			code.lang-ts {
				color: #009688 !important;
			}
		</style>
	</head>
	<body class="loading sidebar-chevron-right sidebar-group-box sidebar-toggle-chevron">
		<div id="app"></div>
		<script>
			window.$docsify = {
				name: 'Nebulosa',
				repo: 'tiagohm/nebulosa.ts',
				logo: 'nebulosa.ico',
				coverpage: true,
				executeScript: true,
				hideSidebar: false,
				noEmoji: true,
				search: {
					paths: 'auto',
					depth: 3,
					maxAge: 3600000,
					placeholder: 'Search topics, APIs, concepts...',
					noData: 'No matching topic.',
				},
			}
		</script>
		<script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
		<script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
		<script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
		<script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
	</body>
</html>
