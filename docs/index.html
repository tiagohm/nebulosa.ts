<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Nebulosa</title>
		<meta name="description" content="Elegant astronomy for TypeScript. Supercharged by Bun." />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css" />
		<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css" />
		<link rel="icon" href="nebulosa.ico" type="image/x-icon" />
		<style>
			:root {
				--theme-color: #2196f3;
				--cover-color: #212121;
				--cover-title-color: var(--theme-color);
				--cover-title-font: 600 var(--font-size-xxxl) var(--font-family);
				--color-text: #bdbdbd;
				--heading-color: #fafafa;
				--code-color: #ff7043;
				--content-max-width: 120ch;
				--scroll-padding-top: 64px;
			}

			html,
			body {
				font-size: 14px;
			}

			.github-corner {
				position: fixed;
			}

			.octo-body,
			.octo-arm {
				color: #fff;
			}

			.anchor:is(.markdown-section a):hover {
				text-decoration-color: transparent !important;
				color: #fff;
			}

			.markdown-section p,
			.markdown-section li {
				text-align: justify;
			}

			.markdown-section p code,
			.markdown-section p a {
				text-justify: none;
			}

			section.content {
				font-family: monospace;
			}

			a:not(.button) {
				color: var(--link-underline-color);
				text-decoration-line: none;
			}

			a:not(.button):hover {
				text-decoration-line: underline;
			}

			code.lang-ts {
				color: #bdbdbd !important;
			}

			/* Host for the search plugin, which docsify places in a sidebar that hideSidebar removes. */
			.sidebar.search-host {
				visibility: visible;
				position: sticky;
				top: 16px;
				bottom: auto;
				left: 16px;
				translate: none;
				width: min(320px, calc(100vw - 90px));
				max-height: calc(100vh - 24px);
				overflow-y: auto;
				border: none;
				background: var(--color-bg);
			}

			.sidebar.search-host .search {
				margin: 0;
			}

			.sidebar.search-host .results-panel:not(:empty),
			.sidebar.search-host .results-status:not(:empty) {
				padding: 0 10px;
				background: var(--color-bg);
			}

			/* Close the results overlay once a result is opened or focus leaves the search. */
			.sidebar.search-host:not(:focus-within) :is(.results-panel, .results-status) {
				display: none;
			}

			article h3::before {
				content: '➡️';
				cursor: pointer;
				margin-right: 4px;
			}

			article h3.expanded::before {
				content: '⬇️';
			}

			.colapsed {
				display: none;
			}

			pre.shiki {
				padding: 16px;
				overflow-x: auto;
				border-radius: 8px;
			}

			pre.shiki code {
				background: transparent;
				padding: 0;
			}
		</style>
	</head>
	<body class="loading sidebar-chevron-right sidebar-group-box sidebar-toggle-chevron">
		<div id="app"></div>
		<script>
			window.$docsify = {
				name: 'Nebulosa',
				repo: 'tiagohm/nebulosa.ts',
				logo: 'nebulosa.ico',
				coverpage: true,
				executeScript: true,
				hideSidebar: true,
				noEmoji: true,
				search: {
					paths: 'auto',
					depth: 3,
					maxAge: 3600000,
					placeholder: 'Search topics, APIs, concepts...',
					noData: 'No matching topic.',
				},
				markdown: {
					renderer: {
						code({ text, lang }) {
							return `<sh data-lang="${lang}" class="${lang}">${text}</sh>`
						},
					},
				},
			}
		</script>
		<script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
		<script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
		<script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
		<script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
		<script>
			function ready() {
				window.documenter.init()
				window.documenter.syntaxHighlightWithLang('json')
				window.documenter.syntaxHighlightWithLang('sh')
			}

			// The search plugin mounts into `.sidebar`, which hideSidebar omits. Registered first, this
			// mounted hook adds the host after docsify binds its own sidebar events and before search runs.
			window.$docsify.plugins.unshift(function (hook) {
				hook.mounted(function () {
					const host = document.createElement('div')
					host.className = 'sidebar search-host'
					document.body.appendChild(host)
				})

				hook.ready(ready)
			})

			window.addEventListener('hashchange', () => window.documenter.expandFromHash())
		</script>
		<script type="module" src="index.mjs"></script>
	</body>
</html>
