<!doctype html>
<html>
	<head>
		<meta charset="utf-8" />
		<title>Nebulosa</title>
		<meta name="description" content="Elegant astronomy for TypeScript. Supercharged by Bun." />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css" />
		<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/core-dark.min.css" />
		<link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/addons/vue.min.css" />
		<link rel="icon" href="nebulosa.ico" type="image/x-icon" />
		<style>
			:root {
				--theme-color: rgb(6, 7, 102);
				--cover-color: #111;
				--cover-title-color: var(--theme-color);
				--cover-title-font: 600 var(--font-size-xxxl) var(--font-family);
				--color-text: #ccc;
				--heading-color: #eee;
			}

			.octo-body {
				color: #fff;
			}

			.anchor:is(.markdown-section a):hover {
				text-decoration-color: transparent !important;
				color: #fff;
			}

			section.content {
				font-family: monospace;
			}
		</style>
	</head>
	<body class="loading sidebar-chevron-right">
		<div id="app"></div>
		<script>
			window.$docsify = {
				name: 'Nebulosa',
				repo: 'tiagohm/nebulosa.ts',
				logo: 'nebulosa.ico',
				coverpage: true,
				hideSidebar: true,
			}
		</script>
		<script src="//cdn.jsdelivr.net/npm/docsify@5"></script>
		<script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
	</body>
</html>
